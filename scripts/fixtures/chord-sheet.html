<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 1080px; font-family: "Microsoft YaHei", sans-serif; background: #fff; color: #333; }
  .sheet { padding: 60px 70px; }
  h1 { font-size: 40px; text-align: center; letter-spacing: 6px; margin: 0 0 6px; }
  .sub { text-align: center; font-size: 22px; color: #777; margin-bottom: 50px; }
  .verse { margin-bottom: 60px; }
  .row { display: flex; }
  .chords { font-weight: 700; font-size: 30px; color: #111; height: 52px; }
  .chords span { display: inline-block; margin-right: 130px; }
  .chords.tight span { margin-right: 74px; }
  .lyrics { font-size: 28px; color: #444; line-height: 1.9; }
  .lyrics span { display: inline-block; margin-right: 8px; }
  .sec { font-size: 26px; font-weight: 700; color: #222; margin: 0 0 14px; }
</style>
</head>
<body>
<div class="sheet">
  <h1>童年</h1>
  <div class="sub">1=C&nbsp;&nbsp;&nbsp;&nbsp;4/4&nbsp;&nbsp;&nbsp;&nbsp;Capo: 0</div>

  <div class="sec">【主歌一】</div>
  <div class="verse">
    <div class="row"><div class="chords"><span>C</span><span>G</span></div></div>
    <div class="row"><div class="lyrics"><span>池塘</span><span>边的</span><span>榕树</span><span>上</span></div></div>
    <div class="row"><div class="chords"><span>Am</span><span>Em</span></div></div>
    <div class="row"><div class="lyrics"><span>知了</span><span>在</span><span>声声</span><span>叫着</span><span>夏天</span></div></div>
    <div class="row"><div class="chords"><span>F</span><span>C</span></div></div>
    <div class="row"><div class="lyrics"><span>操场</span><span>边的</span><span>秋千</span><span>上</span></div></div>
    <div class="row"><div class="chords"><span>Dm</span><span>G</span><span>C</span></div></div>
    <div class="row"><div class="lyrics"><span>只有</span><span>蝴蝶</span><span>停在上</span><span>面</span></div></div>
  </div>

  <div class="sec">【副歌】</div>
  <div class="verse">
    <div class="row"><div class="chords"><span>F</span><span>G</span><span>Em</span><span>Am</span></div></div>
    <div class="row"><div class="lyrics"><span>多少</span><span>的日子</span><span>如流水</span><span>般</span><span>过去</span></div></div>
    <div class="row"><div class="chords"><span>Dm7</span><span>G7</span><span>Cmaj7</span></div></div>
    <div class="row"><div class="lyrics"><span>多少</span><span>的</span><span>记忆</span><span>在</span><span>心底</span></div></div>
    <div class="row"><div class="chords"><span>F</span><span>Bbmaj7</span><span>Gsus4</span><span>G</span></div></div>
    <div class="row"><div class="lyrics"><span>阳光</span><span>下</span><span>蜻蜓</span><span>飞</span><span>过来</span></div></div>
    <div class="row"><div class="chords"><span>C</span><span>Am</span><span>Dm</span><span>G</span></div></div>
    <div class="row"><div class="lyrics"><span>一遍</span><span>一遍</span><span>地</span><span>回想</span></div></div>
  </div>

  <div class="sec">【尾奏】</div>
  <div class="verse">
    <div class="row"><div class="chords tight"><span>C</span><span>G</span><span>Am</span><span>Em</span><span>F</span><span>C</span><span>Dm7</span><span>G7</span></div></div>
    <div class="row"><div class="lyrics"><span>啦啦</span><span>啦啦</span><span>啦啦</span><span>啦啦</span><span>啦啦</span><span>啦啦</span><span>啦啦</span></div></div>
  </div>
</div>
</body>
</html>
